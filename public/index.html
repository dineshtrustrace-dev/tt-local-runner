            }
          }
          for (const c of s.containers || []) {
            const chip = el.querySelector(`.sub[data-log="${c.name}"]`);
            if (!chip) continue;
            chip.querySelector('.dot').className = `dot ${c.state === 'running' ? 'running' : c.state === 'missing' ? 'failed' : ''}`;
            chip.title = `${c.name}: ${c.status} — click for log`;
          }
        }
        // Dependency chips follow the live status of what they point at.
        $$('.dep').forEach((d) => {
          const isDb = d.classList.contains('appdb-dep');
          const id = isDb && msg.mongo ? msg.mongo.target : d.dataset.dep;
          if (isDb) d.querySelector('.t').textContent = msg.mongo ? ` · ${dbLabel(svcById(id))}` : '';
          const st = (status[id] || {}).status || 'stopped';
          d.querySelector('.dot').className = `dot ${st}`;
          d.classList.toggle('ok', st === 'running');
        });
        // Duplex cards: each half of the status rail follows its lane; the card takes the "loudest" state.
        $$('.card.duplex').forEach((card) => {
          const lanes = $$('.lane', card);
          for (const l of lanes) card.dataset[l.classList.contains('ro') ? 'ro' : 'rw'] = l.dataset.status;
          const st = lanes.map((l) => l.dataset.status);
          card.dataset.status = ['failed', 'starting', 'running'].find((x) => st.includes(x)) || 'stopped';
          card.querySelector('.dot.head').className = `dot head ${card.dataset.status}`;
        });
        // Stop buttons only make sense when something (besides the hoop SSO session) is up.
        const isLogin = (s) => cfg.services.some((x) => x.id === s.id && x.kind === 'hoop-login');
        const isUp = (s) => !isLogin(s) && s.status !== 'stopped' && !(s.status === 'failed' && !s.ports.some((p) => p.open));
        $('#stop-all').disabled = !msg.services.some(isUp);
        const tabStat = (id, mine) => {
          const running = mine.filter((s) => s.status === 'running').length;
          const tc = $(`[data-tc="${id}"]`);
          if (tc) {
            tc.textContent = `${running}/${mine.length}`;
            const bar = tc.nextElementSibling;
            bar.firstElementChild.style.width = `${mine.length ? (running / mine.length) * 100 : 0}%`;
            bar.classList.toggle('warn', mine.some((s) => s.status === 'failed'));
          }
          return running;
        };
        tabStat('all', msg.services);
        $$('section[data-sec]').forEach((sec) => {
          const ids = cfg.services.filter((x) => x.section === sec.dataset.sec).map((x) => x.id);
          const mine = msg.services.filter((s) => ids.includes(s.id));
          const running = tabStat(sec.dataset.sec, mine);
          const count = sec.querySelector('.sec-count');
          count.textContent = `${running}/${mine.length}`;
          count.classList.toggle('all', mine.length > 0 && running === mine.length);
          sec.querySelector('.sec-bar i').style.width = `${mine.length ? (running / mine.length) * 100 : 0}%`;
          sec.querySelector('[data-sec=stop]').disabled = !mine.some(isUp);
          sec.querySelector('[data-sec=start]').disabled = mine.every((s) => s.status === 'running' || s.status === 'starting');
          // Environment groups: "2 / 5 up"
          $$('.group[data-env]', sec).forEach((g) => {
            const gIds = cfg.services.filter((x) => x.section === sec.dataset.sec && (x.group || '').toLowerCase() === g.dataset.env).map((x) => x.id);
            const gm = msg.services.filter((s) => gIds.includes(s.id));
            g.querySelector('.gmeta').textContent = `${gm.filter((s) => s.status === 'running').length} / ${gm.length} up`;
          });
        });
        const total = msg.services.length;
        const starting = msg.services.filter((s) => s.status === 'starting').length;
        const failed = msg.services.filter((s) => s.status === 'failed').length;
        const setStat = (id, n) => { const e = $(id); e.querySelector('b').textContent = n; e.classList.toggle('zero', !n); };
        setStat('#st-run', up);
        setStat('#st-start', starting);
        setStat('#st-fail', failed);
        $('#summary').textContent = `${up} / ${total}`;
        $('#health-sub').textContent = 'services up';
        $('#ring-pct').textContent = `${total ? Math.round((up / total) * 100) : 0}%`;
        const ring = $('#health-ring');
        const len = 2 * Math.PI * 15;
        ring.style.strokeDashoffset = `${len * (1 - (total ? up / total : 0))}`;
        $('#podman-text').textContent = `Podman: ${msg.podmanMachine}`;
        $('#podman-pill').title = `Podman machine: ${msg.podmanMachine}`;
        $('#podman-dot').className = `dot ${msg.podmanMachine === 'running' ? 'running' : 'stopped'}`;
        const ra = $('#run-all');
        ra.disabled = msg.runAllActive;
        ra.dataset.active = msg.runAllActive ? '1' : '';
        updateRunAll();
        // State filter counts
        const cards = $$('#sections .card');
        for (const f of ['up', 'down', 'issue']) {
          const n = cards.filter((c) => cardState(c) === f).length;
          const e = $(`[data-n="${f}"]`);
          e.textContent = n || '';
        }
        applyFilters();
        applyDb(msg.mongo);
        updateTabIdentity(msg, up);
      }

      // ── App DB: which MongoDB the services' fixed port (27000) forwards to ──
      const svcById = (id) => cfg.services.find((x) => x.id === id);
      // "MongoDB (Dev) · write" → "Dev · write"
      const dbLabel = (s) => (s ? s.name.replace(/^MongoDB\s*/, '').replace(/[()]/g, '') : '');
      let dbState = null;
      function renderDbMenu() {
        const sw = cfg.mongoSwitch;
        if (!sw) return;
        const targets = sw.targets.map(svcById).filter(Boolean);
        const groups = [...new Set(targets.map((s) => s.group || ''))];
        $('#db-menu').innerHTML =
          `<div class="db-head"><b>Which database should the services use?</b>tt-service, tt-pfd, tt-material-compliance and smart-segregation connect to <code>127.0.0.1:${sw.port}</code>. The runner forwards that port to the tunnel you pick here.</div>` +
          groups
            .map((g) => `<div class="db-grp" data-env="${esc(g.toLowerCase())}">${esc(g || 'Other')}</div>` +
              targets.filter((s) => (s.group || '') === g).map((s) =>
                `<button class="db-opt" role="menuitemradio" data-db="${s.id}"><span class="chk"></span><i class="dot"></i><span class="lbl">${esc(dbLabel(s))}</span><span class="acc ${s.access === 'rw' ? 'rw' : ''}">${s.access === 'rw' ? 'Write' : 'Read'}</span><span class="p">:${s.ports[0]}</span></button>`).join(''))
            .join('') +
          `<div class="db-foot" id="db-foot"></div>`;
        $('#appdb').hidden = false;
      }
      function applyDb(m) {
        if (!m || !cfg.mongoSwitch) return;
        dbState = m;
        const s = svcById(m.target);
        const st = status[m.target] || {};
        const box = $('#appdb');
        box.dataset.env = /prod/i.test(s.group || '') ? 'prod' : '';
        box.dataset.access = s.access || 'ro';
        $('#db-name').textContent = dbLabel(s);
        $('#db-dot').className = `dot ${m.error ? 'failed' : st.status || 'stopped'}`;
        $('#db-route').innerHTML = `<span>:${m.port}</span><span class="to">→</span><span class="tp${st.status === 'running' ? ' up' : ''}">:${s.ports[0]}</span>`;
        $('#db-btn').title = m.error
          ? `App DB forwarder is down: ${m.error}`
          : `Services use ${s.name} via 127.0.0.1:${m.port} → :${s.ports[0]}\nTunnel: ${st.message || st.status || '…'} · ${m.connections} open connection(s)\nClick or press D to switch`;
        $$('#db-menu .db-opt').forEach((o) => {
          const on = o.dataset.db === m.target;
          o.classList.toggle('on', on);
          o.setAttribute('aria-checked', on);
          o.querySelector('.chk').textContent = on ? '✓' : '';
          o.querySelector('.dot').className = `dot ${(status[o.dataset.db] || {}).status || 'stopped'}`;
        });
        const foot = $('#db-foot');
        foot.classList.toggle('err', !!m.error);
        foot.textContent = m.error
          ? `✗ Forwarder down: ${m.error}`
          : `${m.connections} open connection${m.connections === 1 ? '' : 's'}. Switching drops them so the drivers reconnect; restart a service to clear cached data.`;
      }
      const setDbMenu = (open) => {
        $('#appdb').classList.toggle('open', open);
        $('#db-btn').setAttribute('aria-expanded', open);
      };
      $('#db-btn').onclick = (e) => { e.stopPropagation(); setDbMenu(!$('#appdb').classList.contains('open')); };
      document.addEventListener('click', (e) => { if (!e.target.closest('#appdb')) setDbMenu(false); });
      $('#db-menu').onclick = (e) => {
        const o = e.target.closest('.db-opt');
        if (!o) return;
        const s = svcById(o.dataset.db);
        setDbMenu(false);
        if (dbState && dbState.target === s.id) return;
        if (/prod/i.test(s.group || '') && !confirm(`Point the services at PRODUCTION data (${dbLabel(s)})?`)) return;
        post('/api/mongo-target', { id: s.id }).then((ok) => ok && toast(`App DB → ${dbLabel(s)} (:${s.ports[0]})`, 'ok'));
        selectLog('runner');
      };

      // ── Tab title + favicon follow the overall state ─────────────────
      // Priority: failed (red) > starting / building (amber) > something up (green) > idle (grey).
      let lastTabKey = '';
      function updateTabIdentity(msg, up) {
        const total = msg.services.length;
        const failed = msg.services.filter((s) => s.status === 'failed').length;
        const busy = msg.runAllActive || msg.services.some((s) => s.status === 'starting' || (s.build && s.build.status === 'running'));
        const state = failed ? 'failed' : busy ? 'busy' : up ? 'up' : 'idle';
        const key = `${state}|${up}|${total}|${failed}`;
        if (key === lastTabKey) return;
        lastTabKey = key;

        const prefix = { failed: `✕ ${failed} failed · `, busy: '⏳ ', up: '● ', idle: '' }[state];
        document.title = `${prefix}${up}/${total} up — TT Local Runner`;

        const color = { failed: '#dc2626', busy: '#d97706', up: '#059669', idle: '#64748b' }[state];
        const C = 2 * Math.PI * 14.5;
        const frac = total ? up / total : 0;
        const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
          <rect width="32" height="32" rx="8" fill="${color}"/>
          ${frac > 0 && frac < 1 ? `<circle cx="16" cy="16" r="14.5" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="2" stroke-dasharray="${C * frac} ${C}" transform="rotate(-90 16 16)"/>` : ''}
          <g transform="translate(4 4)" fill="#fff"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/><rect x="3" y="5" width="2.6" height="14" rx="1.3"/></g>
        </svg>`;
        $('#favicon').href = `data:image/svg+xml,${encodeURIComponent(svgIcon)}`;
      }

      // ── Logs ─────────────────────────────────────────────────────────
      const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
      const ERR = /\b(ERROR|FATAL|Exception|Error:|ERR!|failed|FAILED|✗)/;
      const WARN = /\b(WARN|WARNING|deprecated)\b/i;

      function renderLog() {
        if (document.body.classList.contains('logs-collapsed')) return;
        const filter = $('#log-filter').value.toLowerCase();
        const lines = (logs[selected] || '').split('\n');
        const out = [];
        for (const line of lines) {
          if (filter && !line.toLowerCase().includes(filter)) continue;
          const isErr = ERR.test(line);
          if (errorsOnly && !isErr) continue;
          const cls = isErr ? 'err' : WARN.test(line) ? 'warn' : /\[runner\]|^\$ /.test(line) ? 'runner' : /✓|successfully|Compiled|ready|Started/.test(line) ? 'ok' : '';
          out.push(`<span${cls ? ` class="${cls}"` : ''}>${esc(line) || ' '}</span>`);
        }
        while (out.length && out[out.length - 1] === '<span> </span>') out.pop();
        const pre = $('#log');
        pre.innerHTML = out.length ? out.join('') : `<span class="log-empty">${filter || errorsOnly ? 'No matching lines' : 'Nothing logged yet'}</span>`;
        if ($('#log-follow').checked) pre.scrollTop = pre.scrollHeight;
      }

      let renderQueued = false;
      const queueRender = () => {
        if (renderQueued) return;
        renderQueued = true;
        requestAnimationFrame(() => { renderQueued = false; renderLog(); });
      };

      async function selectLog(id) {
        selected = id;
        $('#log-select').value = id;
        const owner = logOwner[id] || id;
        $$('.card').forEach((c) => c.classList.toggle('selected', c.dataset.id === owner));
        $$('.sub').forEach((c) => c.classList.toggle('selected', c.dataset.log === id));
        $$('.lane').forEach((c) => c.classList.toggle('selected', c.dataset.svc === id));
        if (logs[id] === undefined) {
          const r = await fetch(`/api/logs/${id}`).then((r) => r.json());
          logs[id] = r.text.replace(ANSI, '');
        }
        setTick(id);
        renderLog();
      }
      // Latest line of the selected log, shown on the collapsed "Logs" pill.
      function setTick(id) {
        if (id !== selected) return;
        const lines = (logs[id] || '').trimEnd().split('\n');
        $('#log-tick').textContent = lines[lines.length - 1] || '';
      }

      $('#log-select').onchange = (e) => selectLog(e.target.value);
      $('#log-filter').oninput = renderLog;
      $('#log-errors').onclick = (e) => {
        errorsOnly = !errorsOnly;
        e.currentTarget.classList.toggle('on', errorsOnly);
        renderLog();
      };
      $('#log-clear').onclick = async () => {
        await fetch(`/api/logs/${selected}`, { method: 'DELETE' });
        logs[selected] = '';
        setTick(selected);
        renderLog();
      };

      // ── Log dock: collapse + drag-resize (both remembered) ───────────
      const wide = () => matchMedia('(min-width: 1101px)').matches;
      function setCollapsed(c) {
        document.body.classList.toggle('logs-collapsed', c);
        $('#log-toggle').innerHTML = wide() ? I.hide : I.down;
        store.set('logCollapsed', c);
        if (!c) renderLog();
      }
      const root = document.documentElement.style;
      const logW = store.get('logWidth', null);
      const logH = store.get('logHeight', null);
      if (logW) root.setProperty('--log-w', `${logW}px`);
      if (logH) root.setProperty('--log-h', `${logH}px`);
      setCollapsed(store.get('logCollapsed', false));
      const toggleLogs = () => setCollapsed(!document.body.classList.contains('logs-collapsed'));
      $('#log-toggle').onclick = $('#log-title').onclick = $('#log-fab').onclick = toggleLogs;
      matchMedia('(min-width: 1101px)').addEventListener('change', () => setCollapsed(document.body.classList.contains('logs-collapsed')));

      $('#log-resize').onpointerdown = (e) => {
        e.preventDefault();
        document.body.classList.add('resizing');
        const isWide = wide();
        const move = (ev) => {
          if (isWide) root.setProperty('--log-w', `${Math.max(320, Math.min(window.innerWidth - 420, window.innerWidth - ev.clientX))}px`);
          else root.setProperty('--log-h', `${Math.max(120, Math.min(window.innerHeight - 200, window.innerHeight - ev.clientY))}px`);
        };
        const up = () => {
          document.body.classList.remove('resizing');
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          const p = $('#log-panel');
          if (isWide) store.set('logWidth', p.offsetWidth); else store.set('logHeight', p.offsetHeight);
        };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      };

      $('#run-all').onclick = () => post('/api/run-all', { ids: included }).then((ok) => { if (ok) toast(`Starting ${included.length} services…`); selectLog('runner'); });
      $('#stop-all').innerHTML = `${I.stop}<span class="lbl">Stop all</span>`;
      $('#stop-all').title = 'Stop every service and disconnect all hoop tunnels';
      $('#stop-all').onclick = () => {
        if (confirm('Stop every service and disconnect all hoop tunnels?')) post('/api/stop-all').then((ok) => { if (ok) toast('Stopping everything…'); selectLog('runner'); });
      };

      // ── Keyboard: / search · Esc clear · L logs · 1-9 tabs ───────────
      document.addEventListener('keydown', (e) => {
        const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
        if (e.key === 'Escape' && $('#appdb').classList.contains('open')) { setDbMenu(false); return; }
        if (e.key === 'Escape') {
          if ($('#search').value || document.activeElement === $('#search')) { $('#search').value = ''; $('#search').blur(); }
          else if (stateFilter !== 'all') { stateFilter = 'all'; store.set('stateFilter', stateFilter); }
          applyFilters();
          return;
        }
        if (typing || e.metaKey || e.ctrlKey || e.altKey) {
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#search').focus(); $('#search').select(); }
          return;
        }
        if (e.key === '/') { e.preventDefault(); $('#search').focus(); }
        else if (e.key.toLowerCase() === 'l') toggleLogs();
        else if (e.key.toLowerCase() === 'd' && !$('#appdb').hidden) setDbMenu(!$('#appdb').classList.contains('open'));
        else if (/^[1-9]$/.test(e.key)) { const t = $$('#tabs .tab')[+e.key - 1]; if (t) t.click(); }
      });

      // ── Boot ─────────────────────────────────────────────────────────
      updateRunAll();
      (async () => {
        cfg = await fetch('/api/config').then((r) => r.json());
        const ids = cfg.services.map((s) => s.id);
        // Cards added to config.js since the last visit start ticked "in all" (unless they set inAll: false).
        const known = store.get('known', included);
        const byDefault = cfg.services.filter((s) => s.inAll !== false).map((s) => s.id);
        if (!Array.isArray(included)) included = byDefault;
        else included = [...included.filter((id) => ids.includes(id)), ...byDefault.filter((id) => !known.includes(id))];
        store.set('included', included);
        store.set('known', ids);
        for (const s of cfg.services) for (const c of s.containers || []) logOwner[c.name] = s.id;
        for (const s of cfg.services) if (s.pair) logOwner[s.id] = s.pair.id;
        renderSections();
        renderDbMenu();
        updateRunAll();
        selectLog('runner');
        const es = new EventSource('/events');
        es.onopen = () => { document.body.classList.remove('offline'); $('#live').textContent = 'LIVE'; };
        es.onmessage = (e) => {
          const msg = JSON.parse(e.data);
          if (msg.type === 'status') applyStatus(msg);
          if (msg.type === 'log' && logs[msg.id] !== undefined) {
            logs[msg.id] = (logs[msg.id] + msg.text.replace(ANSI, '')).slice(-MAX_LOG);
            if (msg.id === selected) { setTick(msg.id); queueRender(); }
          }
        };
        es.onerror = () => {
          document.body.classList.add('offline');
          $('#live').textContent = 'OFFLINE';
          $('#summary').textContent = 'Runner offline';
          $('#health-sub').textContent = 'is `node server.js` running?';
        };
      })();
    </script>
  </body>
</html>
